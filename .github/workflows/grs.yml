name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Main Stats Card
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Top Languages Card
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Pinned Repo: AltanaViewer
      - name: Generate AltanaViewer pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=AltanaViewer&theme=tokyonight&show_owner=true&border_radius=10
          path: profile/AltanaViewer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Pinned Repo: AltanaListener
      - name: Generate AltanaListener pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=AltanaListener&theme=tokyonight&show_owner=true&border_radius=10
          path: profile/AltanaListener.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 5. Pinned Repo: Dressup-Mod
      - name: Generate Dressup-Mod pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Dressup-Mod&theme=tokyonight&show_owner=true&border_radius=10
          path: profile/Dressup-Mod.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 6. Pinned Repo: GearInfo-Mod
      - name: Generate GearInfo-Mod pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=GearInfo-Mod&theme=tokyonight&show_owner=true&border_radius=10
          path: profile/GearInfo-Mod.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 7. Pinned Repo: SheolHelper-Mod
      - name: Generate SheolHelper-Mod pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=SheolHelper-Mod&theme=tokyonight&show_owner=true&border_radius=10
          path: profile/SheolHelper-Mod.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 8. Pinned Repo: SimplePull
      - name: Generate SimplePull pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=SimplePull&theme=tokyonight&show_owner=true&border_radius=10
          path: profile/SimplePull.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Commit all generated SVGs to the profile/ directory
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
